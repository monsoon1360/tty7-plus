<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; img-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="fonts.css">
<style>
:root{color-scheme:light dark;--background:#fcfcfb;--foreground:#1c1c1e;--toolbar:#f3f3f1;--fill:#ecece9}
@media(prefers-color-scheme:dark){:root{--background:#1e1e20;--foreground:#ececed;--toolbar:#17171a;--fill:#29292c}}
:root[data-theme="light"]{color-scheme:light;--background:#fcfcfb;--foreground:#1c1c1e;--toolbar:#f3f3f1;--fill:#ecece9}
:root[data-theme="dark"]{color-scheme:dark;--background:#1e1e20;--foreground:#ececed;--toolbar:#17171a;--fill:#29292c}
html,body{margin:0;height:100%;background:var(--background);color:var(--foreground);overflow:hidden}
#viewport{position:fixed;inset:0;overflow:auto;overscroll-behavior:contain;touch-action:none}
#terminal{width:max-content;min-width:100%;padding:2px;box-sizing:border-box}
.xterm-viewport{overscroll-behavior:contain}
/* Keep the invisible IME target onscreen while the shared PTY resize is pending. */
#terminal .xterm-helper-textarea{position:fixed!important;top:2px!important;left:2px!important}
#history{position:fixed;inset:0;overflow:auto;overscroll-behavior:contain;background:var(--background);z-index:20}
#history-toolbar{position:sticky;top:0;left:0;background:var(--toolbar);padding:8px;font:14px sans-serif}
#history-text,#history-screen{margin:0;padding:2px;font:14px var(--terminal-font);white-space:pre}
</style>
</head><body>
<div id="viewport" aria-label="远程终端，上下滑动查看历史，左右滑动查看宽屏内容">
<div id="terminal"></div>
<section id="history" aria-label="已保留的主屏幕历史" hidden>
<div id="history-toolbar"><span id="history-status">主屏幕历史（只读）</span></div>
<pre id="history-text"></pre>
<pre id="history-screen" aria-label="进入历史时的终端画面"></pre>
</section>
</div>
<script src="xterm.js"></script><script src="screen-widths.js"></script><script src="terminal.js"></script></body></html>
